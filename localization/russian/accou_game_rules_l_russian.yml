 rule_accou_search_range_player: "#P Активные придворные:#! Диапазон поиска персонажей для игроков"
 setting_accou_search_range_player_small: "#high Маленький#!"
 setting_accou_search_range_player_small_desc: "Персонажи в этой и соседних держав, находящиеся в радиусе 150 пикселей карты, включаются в поиск для игроков."
 setting_accou_search_range_player_medium: "#high Средний#!"
 setting_accou_search_range_player_medium_desc: "Персонажи в этой и соседних держав, находящиеся в радиусе 250 пикселей карты, включаются в поиск для игроков."
 setting_accou_search_range_player_large: "#high Большой#!"
 setting_accou_search_range_player_large_desc: "Персонажи в этой и соседних держав, находящиеся в радиусе 650 пикселей карты, включаются в поиск для игроков."
 setting_accou_search_range_player_huge: "#high Огромный#!"
 setting_accou_search_range_player_huge_desc: "Персонажи в этой и соседних держав, находящиеся в радиусе 850 пикселей карты, включаются в поиск для игроков."
 setting_accou_search_range_player_massive: "Массивный"
 setting_accou_search_range_player_massive_desc: "Персонажи в этой и соседних держав, находящиеся в радиусе 1200 пикселей карты, включаются в поиск для игроков."
 setting_accou_search_range_player_all: "#high Все#!"
 setting_accou_search_range_player_all_desc: "Все персонажи в этой и соседних держав включаются в поиск для игроков."

 rule_accou_search_range_ai: "#P Активные придворные:#! Диапазон поиска персонажей для ИИ правителей"
 setting_accou_search_range_ai_medium: "#high От маленького до большого#!"
 setting_accou_search_range_ai_medium_desc: "Персонажи в этой и соседних держав, находящиеся в радиусе от 150 до 650 пикселей карты в зависимости от ранга, включаются в поиск для ИИ правителей (наиболее быстро)."
 setting_accou_search_range_ai_large: "От среднего до огромного"
 setting_accou_search_range_ai_large_desc: "Персонажи в этой и соседних держав, находящиеся в радиусе от 250 до 850 пикселей карты в зависимости от ранга, включаются в поиск для ИИ правителей."
 setting_accou_search_range_ai_huge: "#high От большого до массивного#!"
 setting_accou_search_range_ai_huge_desc: "Персонажи в этой и соседних держав, находящиеся в радиусе от 650 до 1200 пикселей карты в зависимости от ранга, включаются в поиск для ИИ правителей (наиболее медленно)."

 rule_accou_wrong_gender_marriage_requests: "#P Активные придворные:#! Просьбы о браке от недоминирующего пола"
 setting_accou_wrong_gender_marriage_requests_not_allowed: "#high Запрещены#!"
 setting_accou_wrong_gender_marriage_requests_not_allowed_desc: "Просьбы о браке от персонажей недоминирующего пола запрещены."
 setting_accou_wrong_gender_marriage_requests_highborn_only: "Только высокородные"
 setting_accou_wrong_gender_marriage_requests_highborn_only_desc: "Просьбы о браке от персонажей недоминирующего пола разрешены только в том случае, если они высокородные."
 setting_accou_wrong_gender_marriage_requests_allowed: "#high Разрешены#!"
 setting_accou_wrong_gender_marriage_requests_allowed_desc: "Просьбы о браке от персонажей недоминирующего пола разрешены."

 rule_accou_marriage_requests_for_players_lovers: "#P Активные придворные:#! Просьбы о браке для любовников игрока"
 setting_accou_marriage_requests_for_players_lovers_not_allowed: "#high Запрещены#!"
 setting_accou_marriage_requests_for_players_lovers_not_allowed_desc: "Просьбы о браке для любовников игрока запрещены."
 setting_accou_marriage_requests_for_players_lovers_allowed: "Разрешены"
 setting_accou_marriage_requests_for_players_lovers_allowed_desc: "Просьбы о браке для любовников игрока разрешены."

 rule_accou_marriage_ai_acceptance_check: "#P Активные придворные:#! Принятие взаимодействий ИИ"
 setting_accou_marriage_ai_acceptance_check_original: "#high Оригинальное#!"
 setting_accou_marriage_ai_acceptance_check_original_desc: "Принятие взаимодействий ИИ проверяется с использованием оригинальных модификаторов (медленнее, более совместимо, всегда точно)."
 setting_accou_marriage_ai_acceptance_check_quick: "Быстрое"
 setting_accou_marriage_ai_acceptance_check_quick_desc: "Принятие взаимодействий ИИ проверяется более быстрым методом (быстрее, менее совместимо, точность >99.99%)."

