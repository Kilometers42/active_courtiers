 rule_accou_marriage_candidate_quality_threshold: "#P Активные придворные:#! Порог качества кандидатов на брак"
 setting_accou_marriage_candidate_quality_threshold_very_high: "#high Очень высокий#!"
 setting_accou_marriage_candidate_quality_threshold_very_high_desc: "Только самые лучшие кандидаты на брак будут отобраны, придворным может быть трудно найти подходящую пару."
 setting_accou_marriage_candidate_quality_threshold_high: "#high Высокий#!"
 setting_accou_marriage_candidate_quality_threshold_high_desc: "Только высококачественные кандидаты на брак будут отобраны."
 setting_accou_marriage_candidate_quality_threshold_medium: "Средний"
 setting_accou_marriage_candidate_quality_threshold_medium_desc: "Кандидаты на брак с приемлемым качеством будут отобраны."
 setting_accou_marriage_candidate_quality_threshold_low: "#high Низкий#!"
 setting_accou_marriage_candidate_quality_threshold_low_desc: "Большинство кандидатов на брак с разумной совместимостью будут отобраны."
 setting_accou_marriage_candidate_quality_threshold_very_low: "#high Очень низкий#!"
 setting_accou_marriage_candidate_quality_threshold_very_low_desc: "Почти любой совместимый кандидат на брак будет отобран."

